<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreelanceLeads.io - Login</title>
  <link rel="stylesheet" href="assets/app.css">
  <style>
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; }
    .auth-logo { text-align: center; font-size: 1.5rem; font-weight: 700; color: var(--green); margin-bottom: 8px; }
    .auth-subtitle { text-align: center; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 32px; }
    .auth-error { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">🔍 FreelanceLeads.io</div>
      <div class="auth-subtitle">Sign in to your account</div>
      <div class="auth-error" id="error"></div>
      <form onsubmit="doLogin(event)">
        <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" type="submit" id="loginBtn">Sign In</button>
      </form>
      <div class="auth-footer">Don't have an account? <a href="register.html">Sign up free</a></div>
    </div>
  </div>
  <script src="assets/api.js"></script>
  <script>
    if (api.isLoggedIn()) window.location.href = "dashboard.html";
    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.disabled = true; btn.textContent = "Signing in...";
      try {
        await api.login(document.getElementById("email").value, document.getElementById("password").value);
        window.location.href = "dashboard.html";
      } catch (err) {
        document.getElementById("error").textContent = err.message;
        document.getElementById("error").style.display = "block";
        btn.disabled = false; btn.textContent = "Sign In";
      }
    }
  </script>
</body>
</html>
