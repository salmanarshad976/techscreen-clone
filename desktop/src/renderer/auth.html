<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com" />
    <title>Tech Screen — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth">
    <div class="auth-card">
      <h1 class="display">Tech Screen</h1>
      <p class="lead">Your invisible interview assistant</p>

      <div class="auth-tabs" role="tablist">
        <div class="auth-tab active" data-tab="login" role="tab">Log in</div>
        <div class="auth-tab" data-tab="register" role="tab">Sign up</div>
      </div>

      <div id="alert" class="alert" style="display: none"></div>

      <form id="form-login">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn">Log in</button>
      </form>

      <form id="form-register" style="display: none">
        <div class="field">
          <label for="reg-name">Full name</label>
          <input id="reg-name" type="text" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="reg-password">Password (min 8 chars)</label>
          <input
            id="reg-password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>
        <button type="submit" class="btn">Create account</button>
      </form>

      <div class="helper">
        Hotkeys after login:
        <span class="kbd">Ctrl/Cmd+Shift+Space</span> show/hide overlay,
        <span class="kbd">Ctrl/Cmd+Shift+Enter</span> solve from screen,
        <span class="kbd">Ctrl/Cmd+Shift+M</span> toggle click-through.
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
