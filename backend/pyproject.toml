[project]
name = "freelanceleads-backend"
version = "1.0.0"
description = "FreelanceLeads.io clone backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "aiosqlite>=0.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
